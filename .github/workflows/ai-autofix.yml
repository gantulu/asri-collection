name: AI Safe Auto-Fix

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ai-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-patch:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'codex/auto-fix-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_patch: ${{ steps.diff.outputs.has_patch || 'false' }}
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check API key configuration
        id: preflight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -n "$OPENAI_API_KEY" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'OPENAI_API_KEY is not configured; auto-fix skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Codex safe auto-fix
        if: steps.preflight.outputs.configured == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/prompts/ai-autofix.md
          output-file: /tmp/ai-autofix-output.md
          sandbox: workspace-write
          safety-strategy: drop-sudo

      - name: Build patch artifact
        id: diff
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        run: |
          git add -N -A
          git diff --check
          git diff --binary > "$RUNNER_TEMP/ai-autofix.patch"
          if [[ -s "$RUNNER_TEMP/ai-autofix.patch" ]]; then
            echo 'has_patch=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_patch=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload patch
        if: steps.diff.outputs.has_patch == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-autofix-patch
          path: ${{ runner.temp }}/ai-autofix.patch
          if-no-files-found: error
          retention-days: 3

  open-fix-pull-request:
    needs: generate-patch
    if: needs.generate-patch.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout original pull request branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.repository }}
          fetch-depth: 0

      - name: Download generated patch
        uses: actions/download-artifact@v4
        with:
          name: ai-autofix-patch
          path: ${{ runner.temp }}/ai-autofix

      - name: Apply patch and open separate PR
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$RUNNER_TEMP/ai-autofix/ai-autofix.patch"
          git apply --index "$patch_file"
          if git diff --cached --quiet; then
            echo 'Patch contains no applicable changes.'
            exit 0
          fi
          fix_branch="codex/auto-fix-pr-${SOURCE_PR}-${RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$fix_branch"
          git commit -m "fix: safe automated fixes for PR #${SOURCE_PR}"
          git push origin "$fix_branch"
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          This pull request contains a limited, automatically generated safe-fix patch for #${SOURCE_PR}.

          - Review the diff and test results before merging.
          - Business rules, payment, database, and security-sensitive changes are outside the agent's auto-fix authority.
          - This PR was created by automation; it has not been merged.
          EOF
          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$fix_branch" \
            --title "fix: safe automated fixes for PR #${SOURCE_PR}" \
            --body-file "$RUNNER_TEMP/pr-body.md"
